name: KothaCode Package Repository

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space- or comma-separated root packages to build.
        required: false
        default: ""
      reuse_run_id:
        description: Successful package workflow run ID to republish without rebuilding.
        required: false
        default: ""
      resource_class:
        description: Build budget. Large requires a configured large self-hosted runner label.
        required: true
        type: choice
        options:
          - standard
          - large
        default: standard

permissions:
  actions: read
  contents: read

concurrency:
  group: kothacode-aarch64-package-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ github.repository == 'shantoislamdev/kothacode-packages' }}
    uses: ./.github/workflows/_kothacode-build-publish.yml
    with:
      mode: manual
      packages: ${{ inputs.packages || '' }}
      resource_class: ${{ inputs.resource_class || 'standard' }}
      large_runner_label: ${{ vars.KOTHACODE_LARGE_RUNNER_LABEL }}
      reuse_run_id: ${{ inputs.reuse_run_id || '' }}
    secrets: inherit
