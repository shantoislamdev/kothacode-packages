name: KothaCode Termux Repository

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to build. Dependencies are built automatically.
        required: true
        default: apt bash ca-certificates libcurl dash findutils gawk git jq openssh patch procps psmisc ripgrep tar termux-exec termux-tools termux-keyring unzip util-linux
      bootstrap_extra_packages:
        description: Comma-separated extra packages to include in bootstrap archives.
        required: false
        default: ""
      publish_bootstrap_to_r2:
        description: Upload generated bootstrap zips to bootstrap/ in the R2 bucket.
        required: true
        type: boolean
        default: true
      reuse_run_id:
        description: Run ID of a previous successful build (skips build job to save time)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kothacode-termux-repo
  cancel-in-progress: false

env:
  REPO_URL: https://repo.code.amikotha.com
  R2_BUCKET: kothacode-termux-repo
  TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux-play-store/package-builder@sha256:07d803417c2109d0514c3b3fa79f870dd341c9bdcf6f2f6164b4e877498193ea
  APT_REPO_ORIGIN: KothaCode
  APT_REPO_LABEL: KothaCode Termux
  APT_REPO_SUITE: stable
  APT_REPO_COMPONENT: main
  APT_REPO_ARCHES: aarch64

jobs:
  build-packages:
    name: Build Packages
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          df -h

      - name: Prepare KothaCode APT public key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing APT_GPG_PRIVATE_KEY secret. The repo keyring cannot be built and the repository cannot be signed."
            exit 1
          fi

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')"
          if [[ -z "$key_id" ]]; then
            echo "::error::APT_GPG_PRIVATE_KEY did not contain an importable secret key"
            exit 1
          fi

          gpg --batch --yes --output packages/termux-keyring/termux-packages.gpg --export "$key_id"
          exported_key="$(gpg --batch --no-default-keyring --keyring packages/termux-keyring/termux-packages.gpg \
            --list-keys --with-colons | awk -F: '$1 == "pub" { print $5; exit }')"
          if [[ -z "$exported_key" || "$exported_key" != "$key_id" ]]; then
            echo "::error::Exported keyring does not contain key $key_id"
            exit 1
          fi

      - name: Verify package builder toolchain
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh bash -lc '
            set -euo pipefail
            source scripts/properties.sh
            compiler="clang-${TERMUX_HOST_LLVM_MAJOR_VERSION}"
            "$compiler" --version
            ld.lld --version
            probe_dir=$(mktemp -d)
            trap '\''rm -rf "$probe_dir"'\'' EXIT
            printf '\''int main(void) { return 0; }\n'\'' > "$probe_dir/probe.c"
            "$compiler" -fuse-ld=lld "$probe_dir/probe.c" -o "$probe_dir/probe"
            "$probe_dir/probe"
          '

      - name: Build packages
        env:
          TERMUX_ARCH: ${{ matrix.arch }}
          PACKAGE_LIST: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh ./build-package.sh -a "$TERMUX_ARCH" -f $PACKAGE_LIST

      - name: Print host Python configure diagnostics
        if: ${{ failure() }}
        run: |
          if ! docker container inspect termux-package-builder >/dev/null 2>&1; then
            echo "Package builder container was not created."
            exit 0
          fi
          docker exec termux-package-builder bash -lc '
            shopt -s nullglob
            logs=(/home/builder/.termux-build/_cache/python-*/host-build/config.log)
            if (( ${#logs[@]} == 0 )); then
              echo "No host Python config.log was found."
              exit 0
            fi
            for log in "${logs[@]}"; do
              printf '\''::group::%s\n'\'' "$log"
              cat "$log"
              echo "::endgroup::"
            done
          '

      - name: Sanitize deb filenames for upload
        run: |
          cd output
          for f in *:*; do
            [ -e "$f" ] || continue
            mv -- "$f" "$(echo "$f" | sed 's/:/%3a/g')"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.arch }}
          path: output/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-repo:
    name: Publish APT repo to R2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build-packages
    if: ${{ inputs.publish_bootstrap_to_r2 && !cancelled() && (inputs.reuse_run_id != '' || needs.build-packages.result == 'success') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install publish tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg gzip xz-utils

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          path: built-debs
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore epoch colons in deb filenames
        run: |
          find built-debs -name '*%3a*' | while read f; do
            mv -- "$f" "$(echo "$f" | sed 's/%3a/:/g')"
          done

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APT_GPG_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing APT_GPG_PRIVATE_KEY secret. The repo must be signed so apt can verify it."
            exit 1
          fi

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          signing_key="$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')"
          if [[ -z "$signing_key" ]]; then
            echo "::error::APT_GPG_PRIVATE_KEY did not contain an importable secret key"
            exit 1
          fi
          echo "APT_GPG_SIGNING_KEY=$signing_key" >> "$GITHUB_ENV"

      - name: Generate signed APT repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          bash ./scripts/generate-kothacode-apt-repo.sh \
            --input-dir built-debs \
            --output-dir repo-public

      - name: Export repository public key
        run: |
          set -euo pipefail
          gpg --batch --yes --output repo-public/kothacode-archive-key.gpg \
            --export "$APT_GPG_SIGNING_KEY"
          test -s repo-public/kothacode-archive-key.gpg



      - name: Sync APT repository to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${R2_ACCOUNT_ID:-}" || -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::Missing one or more R2 secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY"
            exit 1
          fi

          aws s3 sync repo-public/dists "s3://$R2_BUCKET/dists" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --delete
          aws s3 sync repo-public/pool "s3://$R2_BUCKET/pool" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --delete
          aws s3 cp repo-public/kothacode-archive-key.gpg \
            "s3://$R2_BUCKET/kothacode-archive-key.gpg" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Sanitize deb filenames for artifact upload
        run: |
          find repo-public -name '*:*.deb' | while read f; do
            mv -- "$f" "$(echo "$f" | sed 's/:/%3a/g')"
          done

      - name: Upload repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: kothacode-apt-repo
          path: repo-public
          retention-days: 7

      - name: Upload repository public key
        uses: actions/upload-artifact@v7
        with:
          name: kothacode-archive-key
          path: repo-public/kothacode-archive-key.gpg
          if-no-files-found: error
          retention-days: 30

  build-bootstraps:
    name: Build ${{ matrix.arch }} bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: publish-repo
    if: ${{ !cancelled() && needs.publish-repo.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bootstrap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg jq unzip xz-utils zip

      - name: Download repository public key
        uses: actions/download-artifact@v8
        with:
          name: kothacode-archive-key
          path: bootstrap-trust

      - name: Wait for repository metadata
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          packages_url="$REPO_URL/dists/stable/main/binary-$ARCH/Packages"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location "$packages_url" >/dev/null; then
              exit 0
            fi
            echo "Repository metadata not visible yet ($attempt/20): $packages_url"
            sleep 15
          done
          echo "::error::Repository metadata did not become available: $packages_url"
          exit 1

      - name: Generate bootstrap archive
        env:
          ARCH: ${{ matrix.arch }}
          BOOTSTRAP_EXTRA_PACKAGES: ${{ inputs.bootstrap_extra_packages }}
          KOTHACODE_BOOTSTRAP_VERSION: ${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          extra_args=()
          if [[ -n "${BOOTSTRAP_EXTRA_PACKAGES:-}" ]]; then
            extra_args+=(--add "$BOOTSTRAP_EXTRA_PACKAGES")
          fi

          ./scripts/generate-bootstraps.sh \
             --architectures "$ARCH" \
             --repository "$REPO_URL" \
             --keyring bootstrap-trust/kothacode-archive-key.gpg \
             "${extra_args[@]}"

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.arch }}
          path: bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload bootstrap manifest
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.arch }}-manifest
          path: bootstrap-${{ matrix.arch }}.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Sync bootstrap archive to R2
        if: ${{ inputs.publish_bootstrap_to_r2 }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          ARCH: ${{ matrix.arch }}
          BOOTSTRAP_VERSION: ${{ github.sha }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${R2_ACCOUNT_ID:-}" || -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::Missing one or more R2 secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY"
            exit 1
          fi

          aws s3 cp "bootstrap-$ARCH.zip" \
            "s3://$R2_BUCKET/bootstrap/releases/$BOOTSTRAP_VERSION/bootstrap-$ARCH.zip" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "bootstrap-$ARCH.manifest.json" \
            "s3://$R2_BUCKET/bootstrap/releases/$BOOTSTRAP_VERSION/bootstrap-$ARCH.manifest.json" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
